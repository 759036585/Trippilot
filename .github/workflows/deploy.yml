name: Deploy

# 推送 main 或手动触发时：先在 GitHub 上构建检查，再同步到云服务器并重启服务
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只允许一个部署在跑，排队而不是互相打断
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------
  # 1. 构建：前端类型检查 + 打包，后端装依赖 + 语法检查
  #    任何一步失败都不会进入部署
  # ---------------------------------------------------------------
  build:
    name: 构建与检查
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: trippilot-frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: trippilot-frontend
        run: npm ci

      - name: 类型检查并构建前端
        working-directory: trippilot-frontend
        env:
          # 生产环境同源部署：默认 '/' 会被前端清成空串 → 请求走 /api/v1/...，由 nginx 反代到后端
          # 如果想前后端分离部署，在仓库变量里设置 VITE_API_BASE_URL 为后端公网地址
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/' }}
          VITE_AMAP_JS_KEY: ${{ secrets.VITE_AMAP_JS_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
        run: |
          if [ -z "$VITE_AMAP_JS_KEY" ]; then
            echo "::error::缺少 VITE_AMAP_JS_KEY，地图会加载失败。请在 Settings → Secrets and variables → Actions 中配置，参考 deploy/README.md"
            exit 1
          fi
          npm run build

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: trippilot-backend/requirements.txt

      - name: 安装后端依赖并做语法检查
        working-directory: trippilot-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q main.py config.py database services

      - name: 保存前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: trippilot-frontend/dist
          retention-days: 3

  # ---------------------------------------------------------------
  # 2. 部署：同步代码与产物到服务器，重启后端、重载 nginx
  # ---------------------------------------------------------------
  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 检查部署配置
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          missing=""
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$SERVER_HOST" ]     || missing="$missing SERVER_HOST"
          [ -n "$SERVER_USER" ]     || missing="$missing SERVER_USER"
          [ -n "$APP_DIR" ]         || missing="$missing APP_DIR"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing，配置方法见 deploy/README.md"
            exit 1
          fi

      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: trippilot-frontend/dist

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: 同步代码到服务器
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          # 服务器是 Alibaba Cloud Linux 3，默认没装 rsync（之前报过 bash: rsync: command not found）。
          # 改用 tar over ssh 同步，只依赖两台机器都自带的 tar / gzip，服务器不用额外装包。
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          TARGET="$SERVER_USER@$SERVER_HOST"

          echo "准备目录，清理上一次的构建产物"
          ssh "${SSH_OPTS[@]}" "$TARGET" APP_DIR="$APP_DIR" 'bash -s' <<'REMOTE'
          set -euo pipefail

          if ! mkdir -p "$APP_DIR" 2>/dev/null; then
            echo "无法创建 $APP_DIR：$(dirname "$APP_DIR") 对用户 $(id -un) 不可写" >&2
            exit 1
          fi

          # 属主自检：APP_DIR 里有不属于当前用户的文件时，rm 和 tar 解包都会 Permission denied
          # （常见于之前用 root 或其他用户手工建过目录）
          owner_bad=""
          [ -w "$APP_DIR" ] || owner_bad="$APP_DIR 本身"
          [ -n "$owner_bad" ] || owner_bad=$(find "$APP_DIR" ! -user "$(id -un)" -print -quit 2>/dev/null || true)
          if [ -n "$owner_bad" ]; then
            {
              echo "::error::部署用户对 APP_DIR 没有写权限，同步必然失败"
              echo "当前 SSH 用户：$(id -un)  uid=$(id -u)  组=$(id -gn)"
              echo "APP_DIR 权限：$(stat -c '%U:%G %A' "$APP_DIR" 2>/dev/null || echo '读取失败')"
              if [ "$owner_bad" != "$APP_DIR 本身" ]; then
                echo "冲突文件：$owner_bad"
                echo "冲突文件权限：$(stat -c '%U:%G %A' "$owner_bad" 2>/dev/null || echo '读取失败')"
              fi
              echo "修复：在服务器上执行（APP_DIR 换成 secret 里配的路径，用户名用上面那个）："
              echo "  sudo chown -R $(id -un):$(id -gn) <APP_DIR>"
            } >&2
            exit 1
          fi

          # dist 必须整体重建，否则旧的 hash 资源文件会和新 index.html 混在一起
          rm -rf "$APP_DIR/trippilot-frontend/dist"
          # 清掉 Python 缓存，避免加载到陈旧的 .pyc
          find "$APP_DIR" -name __pycache__ -type d -prune -exec rm -rf {} + 2>/dev/null || true
          REMOTE

          # 同步源码：排除依赖目录、构建产物、本地密钥
          # 服务器上的 .env.local / venv 不在归档里，不会被覆盖
          echo "同步源码"
          tar -czf - \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.local' \
            --exclude='deploy_key*' \
            . | ssh "${SSH_OPTS[@]}" "$TARGET" "tar -xzf - -C '$APP_DIR'"

          # 前端产物来自 CI 构建，单独同步（目标目录已在上面清空）
          echo "同步前端构建产物"
          tar -czf - -C trippilot-frontend/dist . \
            | ssh "${SSH_OPTS[@]}" "$TARGET" "mkdir -p '$APP_DIR/trippilot-frontend/dist' && tar -xzf - -C '$APP_DIR/trippilot-frontend/dist'"

      - name: 安装依赖并重启服务
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" APP_DIR="$APP_DIR" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR/trippilot-backend"

          if [ ! -f .env.local ]; then
            echo "服务器上缺少 $APP_DIR/trippilot-backend/.env.local，请先按 deploy/README.md 配置"
            exit 1
          fi

          if [ ! -d venv ]; then
            # 服务器是 Alibaba Cloud Linux 3，系统自带 python3 只有 3.6，项目需要 3.10+
            # 优先用 python3.11，没有就退回 python3（换到别的发行版也能跑）
            PYTHON_BIN=$(command -v python3.11 || command -v python3)
            echo "首次部署，用 $PYTHON_BIN 创建虚拟环境"
            "$PYTHON_BIN" -m venv venv
          fi

          ./venv/bin/pip install -q --upgrade pip
          ./venv/bin/pip install -q -r requirements.txt

          echo "重启后端服务"
          sudo systemctl restart trippilot

          echo "健康检查"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/ > /dev/null; then
              echo "后端已启动"
              break
            fi
            if [ "$i" = "5" ]; then
              echo "健康检查失败，最近日志："
              sudo journalctl -u trippilot -n 50 --no-pager
              exit 1
            fi
            sleep 2
          done

          echo "重载 nginx"
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE
