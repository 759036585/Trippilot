# TripPilot 站点配置
# 放到 /etc/nginx/sites-available/trippilot 并软链到 sites-enabled 后：
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 换成你的域名；没有域名就填服务器公网 IP
    server_name your-domain.com;

    # 前端构建产物，由 CI 同步到这里
    root /opt/trippilot/trippilot-frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # 后端接口：原样转发给 uvicorn（注意 proxy_pass 后面不要加斜杠，路径才会完整保留）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 规划是同步等待大模型返回的，默认 60s 容易超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 带哈希的静态资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用路由回退：/trips、/workbench 这类前端路由刷新也能正常打开
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
